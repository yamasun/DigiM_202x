<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237e9cff'/%3E%3Cpath d='M17 19h30v8H25v8h17v8H25v10h-8z' fill='%230b1020'/%3E%3C/svg%3E">
    <title>DigiM 2022 — IoTプレゼンテーション</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f7f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 15%, rgba(64, 106, 255, .24), transparent 32rem),
          radial-gradient(circle at 85% 85%, rgba(0, 208, 179, .16), transparent 30rem),
          #0b1020;
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 76px 0 64px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #7e9cff;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 4.8rem);
        line-height: .98;
        letter-spacing: -.05em;
      }

      .intro {
        max-width: 600px;
        margin: 24px 0 48px;
        color: #aeb7d2;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .decks {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      a {
        display: flex;
        min-height: 220px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px;
        border: 1px solid rgba(174, 189, 235, .2);
        border-radius: 20px;
        background: rgba(22, 31, 59, .72);
        color: inherit;
        text-decoration: none;
        transition: border-color .2s ease, transform .2s ease, background .2s ease;
      }

      a:hover, a:focus-visible {
        border-color: #7e9cff;
        background: rgba(34, 47, 87, .9);
        outline: none;
        transform: translateY(-4px);
      }

      .number {
        color: #7e9cff;
        font-size: .82rem;
        font-weight: 800;
        letter-spacing: .12em;
      }

      h2 {
        margin: 24px 0 0;
        font-size: 1.35rem;
        line-height: 1.45;
      }

      .open {
        color: #aeb7d2;
        font-size: .9rem;
        font-weight: 700;
      }

      footer {
        margin-top: 42px;
        color: #75809e;
        font-size: .82rem;
      }

      @media (max-width: 760px) {
        main { padding-top: 48px; }
        .decks { grid-template-columns: 1fr; }
        a { min-height: 160px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">DigiM 2022 / IoT</p>
      <h1>デジタルマーケティングと<br>つながる世界</h1>
      <p class="intro">編集可能なプレゼンテーションデッキです。見たい資料を選択してください。</p>

      <section class="decks" aria-label="プレゼンテーション一覧">
        <a href="2_digital_marketing_iot_slides_light.html">
          <div>
            <div class="number">DECK 02</div>
            <h2>デジタルマーケティングの現在地とIoTの衝撃</h2>
          </div>
          <span class="open">プレゼンテーションを開く →</span>
        </a>
        <a href="3_iot_blueprint_slides_clean.html">
          <div>
            <div class="number">DECK 03</div>
            <h2>すべてのモノがネットにつながる時代</h2>
          </div>
          <span class="open">プレゼンテーションを開く →</span>
        </a>
        <a href="4_iot_marketing_blueprint_clean.html">
          <div>
            <div class="number">DECK 04</div>
            <h2>繋がる世界の設計図</h2>
          </div>
          <span class="open">プレゼンテーションを開く →</span>
        </a>
      </section>

      <footer>外部フォント・Tailwind CSS・Font AwesomeをCDNから読み込みます。</footer>
    </main>
  </body>
</html>
